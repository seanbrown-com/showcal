x-common: &common
  build: .
  image: showcal:local
  env_file: .env
  environment:
    DATABASE_PATH: /data/${DATABASE_FILENAME:-showcal.sqlite3}
  volumes:
    - ticket-data:/data
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
services:
  migrate:
    <<: *common
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
  web:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    <<: *common
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "manage.py", "worker"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "worker_health"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  ticket-data:
